# version: '3'
services:
  postgres-db:
    image: postgres:17-alpine
    environment:
    # POSTGRES_DB environment variable can be used to define a different name for the default
    # database that is created when the image is first started
      - POSTGRES_DB=mydb

    # POSTGRES_USER environment variable is used in conjunction with POSTGRES_PASSWORD to set a user and its password.
    # This variable will create the specified user with superuser power and a database with the same name.
    # If it is not specified, then the default user of postgres will be used.
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      # 1. Define the Listeners
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_INTERNAL://0.0.0.0:9092
      # 2. Map the names to a protocol (This fixes your error)
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # 3. Tell Kafka how the internal services (consumer/go-app) reach it
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:29092,PLAINTEXT_INTERNAL://kafka:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  go-db-app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.api
    environment:
      - DB_HOST=postgres-db
      - DB_PASSWORD=mysecretpassword
      - DB_USERNAME=postgres
      - DB_NAME=mydb
      - DB_PORT=5432
      - AZURE_STORAGE_ACCOUNT=anuroopstorageaccountz0x
      - AZURE_STORAGE_CONTAINER=go-app-uploads
      - KAFKA_BROKER=kafka:9092
    ports:
      - 8080:8080
    # Postgres takes a few seconds to be ready.
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_started

  consumer:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.consumer
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_started

volumes:
  postgres-data: