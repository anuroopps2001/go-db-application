apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app-route
  namespace: default
spec:
  hostnames:
  - "mygoapp.com"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https

  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: http

  rules:
  - matches:
      - path:
          type: PathPrefix
          value: /healthz
    backendRefs:
    - name: go-db-service-sample
      port: 8080

  - matches:
      - path:
          type: PathPrefix
          value: /metrics
    backendRefs:
    - name: prometheus-kube-prometheus-prometheus # Exact name of your Prometheus service
      namespace: monitoring
      port: 9090

  - matches:
      - path:
          type: PathPrefix
          value: /grafana
    backendRefs:
    - name: prometheus-grafana # Exact name of your Grafana service
      namespace: monitoring
      port: 80

  - matches:
      - path:
          type: PathPrefix
          value: /
    backendRefs:
    - name: go-db-service-sample
      port: 8080
      namespace: default

  - matches:
      - path:
          type: PathPrefix
          value: /ui/index.html
    backendRefs:
    - name: go-db-service-sample
      port: 8080
      namespace: default