apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-db-app-service-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: go-db-service-sample   # MUST match your service label
  namespaceSelector:
    matchNames:
      - default     # change if your app is in another ns
  endpoints:
  - port: http      # MUST match service port name
    path: /metrics
    interval: 15s
  podTargetLabels:    # To pick the pods which have labels with key "version". Ex: version: 01
  - version