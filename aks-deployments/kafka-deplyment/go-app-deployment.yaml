apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-db-app-version01-with-akv-secrets
  namespace: default # Ensure this matches your Federated Identity
  labels:
    app: go-db
    version: "01"
  annotations:
    kubernetes.io/change-cause: "Migrated to Azure Flexible Server via Workload Identity"
spec:
  selector:
    matchLabels:
      app: go-db
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: go-db
        version: "01"
        # --- ADDED: Workload Identity Trigger ---
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      # --- UPDATED: Federated Service Account ---
      serviceAccountName: psql-auth-sa # FederatedCredential trusts only this SA name

      initContainers:
      - name: wait-for-postgres
        image: postgres:17-alpine
        command:
          - sh
          - -c
          - |
            # UPDATED: Pointing to the new Azure Flexible Server Host
            until pg_isready -h anuroop-psql-flex.postgres.database.azure.com -p 5432 -U psqladmin; do
              echo "waiting for Azure Flexible Server to be ready.."
              sleep 3
            done

      containers:
      - name: go-db-app-container
        image: anuroop21/go-application:v2
        imagePullPolicy: Always

        # --- UPDATED: Environment Variables from Key Vault ---
        env:
        - name: AZURE_STORAGE_ACCOUNT
          value: anuroopstorageaccountz0x
        - name: AZURE_STORAGE_CONTAINER
          value: go-app-uploads
        - name: KAFKA_BROKER
          value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "upload-events"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-creds-k8s # Created by CSI Driver
              key: DB_HOST
        - name: DB_PORT
          value: "5432"
        - name: DB_SERVER
          value: anuroop-psql-flex
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-creds-k8s
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-creds-k8s
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds-k8s
              key: DB_PASSWORD

        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 20

        # --- ADDED: Secret Store Mount ---
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true

        - name: shared-storage
          mountPath: /data/shared

        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 100Mi

      # --- ADDED: CSI Driver Volume ---
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "go-app-kv-secrets" # Must match your SecretsProviderClass name

      - name: shared-storage
        persistentVolumeClaim:
          claimName: my-shared-data