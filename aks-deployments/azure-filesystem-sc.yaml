apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-csi-rwx
provisioner: file.csi.azure.com # Built-in driver in AKS
allowVolumeExpansion: true
mountOptions:
  - mfsymlinks
  - cache=strict
  - nosharesock
  - nobrl # Recommended for performance in many apps
parameters:
  skuName: Standard_LRS # or Premium_LRS for high performance
  protocol: smb