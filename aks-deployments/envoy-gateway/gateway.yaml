kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  gatewayClassName: envoy
  listeners:

  # 🔹 HTTP listener (NEW)
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All

  # 🔹 OPTIONAL: keep HTTPS (for now)
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
        - name: envoy-tls-cert
    allowedRoutes:
      namespaces:
        from: All