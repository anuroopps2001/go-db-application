version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.23

jobs:
  build:
    executor: go-executor
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install dependencies
          working_directory: go-application
          command: |
            go mod tidy

      - run:
          name: Build application
          working_directory: go-application
          command: go build -o app
  
  static-analysis:
      executor: go-executor
      steps:
        - checkout
        - run:
            name: Check formatting
            working_directory: go-application
            command: |
              test -z "$(gofmt -l .)"

        - run:
            name: Run go vet
            working_directory: go-application
            command: go vet ./...

        - run:
            name: Scan go vulnarabilities
            working_directory: go-application
            command: |
              go install golang.org/x/vuln/cmd/govulncheck@latest
              govulncheck ./... || true

  docker-file-linting:
      docker:
        - image: cimg/base:stable
      steps:
        - checkout
        - setup_remote_docker:  # creates a separate, secure VM with a running Docker daemon.
            docker_layer_caching: true    
        - run:
            name: Lint Dockerfile
            command: docker run --rm -i hadolint/hadolint hadolint --ignore DL3018 - < Docker/Dockerfile

  docker-build-and-push:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      
      - setup_remote_docker:
          docker_layer_caching: true  # This "remembers" the layers for next time

      - run:
          name: Build the Docker image
          command: |
            TAG="${CIRCLE_BUILD_NUM}"
            docker build -f Docker/Dockerfile -t $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1} .

      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      - run:
          name: Scan Docker image
          command: |
            ./bin/trivy image --severity HIGH,CRITICAL --ignore-unfixed $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1}

      - run:
          name: Login to DockerHub
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin

      - run:
          name: Push docker image
          command: |
            docker push $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1}
            docker tag $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1} $DOCKERHUB_USER/go-app-circleci:latest
            docker push $DOCKERHUB_USER/go-app-circleci:latest

  update_gitops_dev:
      docker:
        - image: cimg/base:stable
      steps:
        - checkout
        - setup_remote_docker:
            docker_layer_caching: true

        - run:
            name: Clone gitops repo (Dev Branch)
            command: |
              git clone -b feature/circleci-metrics git@github.com:anuroopps2001/go-db-application.git

        - run:
            name: Update the tag
            command: |
              cd k8s/go-db-app/multi-version-deployments
              sed -i "s|image: anuroop21/go-app-circleci:.*|image: anuroop21/go-app-circleci:${CIRCLE_SHA1}|g" go-app-deployment-version02.yaml

        - run:
            name: Commit the changes
            command: |
              cd k8s
              git config user.name "circleCI"
              git config user.email "ci@circleci.com"

              git add .
              git commit -m "update v2 image ${CIRCLE_SHA1}" || echo "no changes"
              git push origin feature/circleci-metrics

  wait_for_rollout:
     machine: true
     resource_class: anuroopps2001/for-aks-rc

     steps:
       - run:
           name:  Authenticate AKS
           command: |
             # Login using the OIDC token from CircleCI
             az login --service-principal \
             -u "$AZURE_CLIENT_ID" \
             -t "$AZURE_TENANT_ID" \
             --federated-token "$CIRCLE_OIDC_TOKEN_V2"

             az aks get-credentials -g rg-aks-southindia --name aks-private-india

       - run:
           name: wait for v2 rollout
           command: |
             kubectl rollout restart deployment/go-db-app-version02 -n go-app-dev --timeout=120s
  
  canary_check:
      docker:
        - image: cimg/base:stable

      steps:
        - checkout

        - run:
            name: Install dependencies
            command: |
              cd k8s/observability/prometheus-grafana-alertting-with-helm/slo/scripts
              sudo apt update
              sudo apt install python3-pip
              pip3 install -r requirements.txt

        - run:
            name: Run canary evaluation
            command: |
              sleep 60
              python3 canary_check.py 

  
workflows:
  version: 2
  build_and_push:
    jobs:
      - build:
          filters:
            branches:
              only:
                - feature/circleci-metrics
        
      - static-analysis: # NEW JOB: Move Docker Linting and Go Vuln checks here
          filters:
            branches:
              only: feature/circleci-metrics

      - docker-file-linting:
          filters:
            branches:
              only: feature/circleci-metrics

      - docker-build-and-push:
          requires:
            - build
            - static-analysis
            - docker-file-linting

      - update_gitops_dev:
          requires:
            - docker-build-and-push

      - wait_for_rollout:
          requires:
            - update_gitops_dev

      - canary_check:
          requires:
            - wait_for_rollout
