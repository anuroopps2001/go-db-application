version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.23

  base:
    docker:
      - image: cimg/base:stable

  azure_self_runner:
    machine: true
    resource_class: anuroopps2001/for-aks-rc

jobs:
  build:
    executor: go-executor
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install dependencies
          working_directory: go-application
          command: |
            go mod tidy

      - run:
          name: Build application
          working_directory: go-application
          command: go build -o app
  
  static-analysis:
      executor: go-executor
      steps:
        - checkout
        - run:
            name: Check formatting
            working_directory: go-application
            command: |
              test -z "$(gofmt -l .)"

        - run:
            name: Run go vet
            working_directory: go-application
            command: go vet ./...

        - run:
            name: Scan go vulnarabilities
            working_directory: go-application
            command: |
              go install golang.org/x/vuln/cmd/govulncheck@latest
              govulncheck ./... || true

  docker-file-linting:
      executor: base
      steps:
        - checkout
        - setup_remote_docker:  # creates a separate, secure VM with a running Docker daemon.
            docker_layer_caching: true    
        - run:
            name: Lint Dockerfile
            command: docker run --rm -i hadolint/hadolint hadolint --ignore DL3018 - < Docker/Dockerfile

  docker-build-and-push:
    executor: base
    working_directory: ~/project
    steps:
      - checkout
      
      - setup_remote_docker:
          docker_layer_caching: true  # This "remembers" the layers for next time

      - run:
          name: Build the Docker image
          command: |
            TAG="${CIRCLE_BUILD_NUM}"
            docker build -f Docker/Dockerfile -t $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1} .

      - run:
          name: Install Trivy
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      - run:
          name: Scan Docker image
          command: |
            ./bin/trivy image --severity HIGH,CRITICAL --ignore-unfixed $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1}

      - run:
          name: Login to DockerHub
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin

      - run:
          name: Push docker image
          command: |
            docker push $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1}
            docker tag $DOCKERHUB_USER/go-app-circleci:${CIRCLE_SHA1} $DOCKERHUB_USER/go-app-circleci:latest
            docker push $DOCKERHUB_USER/go-app-circleci:latest

  update_gitops_dev:
      docker:
        - image: cimg/base:stable
      working_directory: ~/project
      steps:
        - checkout
        - setup_remote_docker:
            docker_layer_caching: true

        - run:
            name: Update the tag
            command: |
              cd argocd/version-specific-go-app/deployments
              sed -i "s|image: anuroop21/go-app-circleci:.*|image: anuroop21/go-app-circleci:${CIRCLE_SHA1}|g" go-app-deployment-version02.yaml

        - run:
            name: Commit the changes
            command: |
              cd argocd/version-specific-go-app/deployments
              git config user.name "circleCI"
              git config user.email "ci@circleci.com"

              git add go-app-deployment-version02.yaml
              git commit -m "update v2 image ${CIRCLE_SHA1} [skip ci]" || echo "no changes"
              git push origin feature/circleci-metrics


  update_traffic:
     executor: base
     working_directory: ~/project
     parameters:
       v1_weight:
         type: string
       v2_weight:
         type: string
     steps:
       - checkout
       - run:
           name: Update traffic split
           command: |
             cd argocd/version-specific-go-app/gateway

             # Update weight for the first backend (v1)
             yq -i '.spec.rules[0].backendRefs[0].weight == << parameters.v1_weight >>' httproute.yaml

             # Update weight for the second backend (v2)
             yq -i '.spec.rules[0].backendRefs[1].weight == << parameters.v2_weight >>' httproute.yaml

       - run:
           name: Push the changes
           command: |
             cd argocd/version-specific-go-app/gateway

             git config user.name "circleCI"
             git config user.email "ci@circleci.com"
             git add .
             git commit -m "Traffic shift v1:<< parameters.v1_weight >> v2:<< parameters.v2_weight >> [skip ci]" || echo "no changes"              
             git push origin feature/circleci-metrics

# ---------------- WAIT ----------------
  wait_for_rollout:
     executor: azure_self_runner

     steps:
       - checkout
       - run:
           name:  Authenticate AKS and Wait for argocd to deploy
           command: |
             # Login using the OIDC token from CircleCI
             az login --service-principal \
             -u "$AZURE_CLIENT_ID" \
             -t "$AZURE_TENANT_ID" \
             --federated-token "$CIRCLE_OIDC_TOKEN_V2"

             az aks get-credentials -g rg-aks-southindia --name aks-private-india

             kubectl rollout status deployment/go-db-app-version02 -n default --timout=60s

# ---------------- CANARY CHECK + ROLLBACK ----------------
  canary_check:
     machine: true
     resource_class: anuroopps2001/for-aks-rc
     parameters:
       v1_rollback_weight:
         type: string
       v2_rollback_weight:
         type: string
     steps:
       - checkout
       - run:
           name: Run checks
           command: |
             export PROMETHEUS_URL="http://10.1.1.7:9090"
             python3 k8s/observability/prometheus-grafana-alertting-with-helm/slo/scripts/canary_check.py

# The command ssh-keyscan github.com >> ~/.ssh/known_hosts performs a "Pre-emptive Trust" setup:
# ssh-keyscan github.com: It reaches out to GitHub and asks for its public host keys (its "digital fingerprint").
# >> ~/.ssh/known_hosts: It appends those fingerprints to a local file on your Azure VM called known_hosts.
# Once that fingerprint is in that file, the next time you run git push, SSH checks the file, sees that the fingerprint matches, and proceeds with the connection silently without asking for permission.
       - run:
           name: Setup SSH
           command: |
             # To make our runner trust github
             mkdir ~/.ssh
             ssh-keyscan github.com >> ~/.ssh/known_hosts

       - run:
           name: Rollback to traffic v1
           when: on_fail
           command: |
             echo "Rollback triggered"
             cd argocd/version-specific-go-app/gateway

             # Update weight for the first backend (v1)
             yq -i '.spec.rules[0].backendRefs[0].weight = << parameters.v1_rollback_weight >>' httproute.yaml

             # Update weight for the second backend (v2)
             yq -i '.spec.rules[0].backendRefs[1].weight = << parameters.v2_rollback_weight >>' httproute.yaml

             git config user.name "circleCI"
             git config user.email "ci@circleci.com"
             git add .
             git commit -m "Rollback to v1 [skip ci]" || true
             git push origin feature/circleci-metrics

             exit 1
      
  promote:
    executor: base
    # Define the working directory so 'checkout' and 'run' are in the same place
    working_directory: ~/project 
    steps:
      - checkout # Pulls the repo into ~/project
      - run:
          name: Promote v2 -> v1
          command: |
            cd argocd/version-specific-go-app/deployments
            sed -i "s|image: anuroop21/go-app-circleci:.*|image: anuroop21/go-app-circleci:${CIRCLE_SHA1}|g" go-app-deployment-version01.yaml

      - run:
          name: Commit the changes
          command: |
            git config user.name "circleCI"
            git config user.email "ci@circleci.com"

            git add argocd/version-specific-go-app/deployments/go-app-deployment-version01.yaml
            git commit -m "Promote v2 -> v1 [skip ci]" || echo true
            git push origin feature/circleci-metrics

workflows:
  version: 2
  build_and_push:
    jobs:
      - build:
          filters:
            branches:
              only:
                - feature/circleci-metrics
        
      - static-analysis: # NEW JOB: Move Docker Linting and Go Vuln checks here
          filters:
            branches:
              only: feature/circleci-metrics

      - docker-file-linting:
          filters:
            branches:
              only: feature/circleci-metrics

      - docker-build-and-push:
          requires:
            - build
            - static-analysis
            - docker-file-linting

      - update_gitops_dev:
          requires:
            - docker-build-and-push

      - update_traffic:
          name: traffic_10
          v1_weight: "90"
          v2_weight: "10"
          requires: [update_gitops_dev]

      - canary_check:
          name: check_10
          v1_rollback_weight: "100"
          v2_rollback_weight: "0"
          requires:
            - traffic_10


      - update_traffic:
          name: traffic_50
          v1_weight: "50"
          v2_weight: "50"
          requires:
            - check_10

      - canary_check:
          name: check_50
          v1_rollback_weight: "100"
          v2_rollback_weight: "0"
          requires:
            - traffic_50

      - update_traffic:
          name: traffic_100
          v1_weight: "0"
          v2_weight: "100"
          requires:
            - check_50

      - promote:
          requires:
            - traffic_100