apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-app-route-canary-route-staging
  namespace: go-db-app-staging
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: nginx-gateway-for-all
    namespace: go-db-app-dev  # Because only one gateway per cluster is allowed
  hostnames:
    - go.app.version.split.staging.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /user
        - path:
            type: PathPrefix
            value: /users
        - path:
            type: PathPrefix
            value: /ready
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: go-db-service-sample-version-01
          port: 8080
          weight: 90
        - name: go-db-service-sample-version-02
          port: 8080
          weight: 10
